<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumiAgent — 算力平权</title>
<meta name="description" content="LumiAgent: 为老旧设备而生的AI编程调度器。Trae创意大赛参赛作品。">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:;">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="theme-vars">
:root {
  --bg: #ffffff;
  --fg: #0f172a;
  --card: #ffffff;
  --primary: #111827;
  --primary-fg: #ffffff;
  --muted: #fafafa;
  --muted-fg: #71717a;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --success: #16a34a;
  --danger: #dc2626;
  --font-sans: 'Geist', ui-sans-serif, sans-serif, system-ui;
  --font-mono: 'Geist Mono', ui-monospace, monospace;
  --radius: 0.75rem;
  --radius-sm: 0.375rem;
  --radius-lg: 1rem;
  --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
  --shadow: 0 2px 4px 0 rgba(0,0,0,0.06), 0 1px 2px 0 rgba(0,0,0,0.03);
}
</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #terminal::-webkit-scrollbar { width: 5px; }
  #terminal::-webkit-scrollbar-track { background: transparent; }
  #terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* 代码块 */
  .code-block {
    font-family: var(--font-mono);
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.65;
    white-space: pre;
    margin: 8px 0;
    color: var(--fg);
  }
  .code-block .kw { color: #7c3aed; font-weight: 500; }
  .code-block .fn { color: #2563eb; }
  .code-block .str { color: #16a34a; }
  .code-block .cmt { color: #a1a1aa; font-style: italic; }
  .code-block .num { color: #ea580c; }

  /* 消息 */
  .sys-msg {
    color: var(--muted-fg);
    font-size: 13px;
    padding: 4px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .user-msg {
    background: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin: 6px 0;
    max-width: 80%;
    margin-left: auto;
    font-size: 14px;
  }
  .user-label { color: var(--muted-fg); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
  .ai-msg {
    padding: 10px 0 10px 14px;
    margin: 6px 0;
    max-width: 80%;
    font-size: 14px;
    line-height: 1.75;
    border-left: 2px solid var(--border);
  }
  .ai-label { color: var(--muted-fg); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }

  /* 欢迎 */
  .welcome-box {
    background: var(--primary);
    color: var(--primary-fg);
    padding: 20px 24px;
    border-radius: var(--radius);
    text-align: center;
    margin-bottom: 20px;
  }
  .welcome-box h1 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .welcome-box p { font-size: 12px; opacity: 0.75; }

  /* 代码提示标签 */
  .hint-tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px;
    background: var(--muted);
    color: var(--muted-fg);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* 状态 */
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; flex-shrink: 0; }
  .dot.ok { background: var(--success); }
  .dot.think { background: #f59e0b; animation: blink 1s infinite; }
  .dot.rest { background: var(--muted-fg); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  @media (prefers-reduced-motion: reduce) {
    .dot.think { animation: none; }
    .rest-bar { animation: none; width: 0%; }
  }

  /* 休息条 */
  .rest-bar-wrap { width: 140px; height: 2px; background: var(--border); border-radius: 1px; margin: 8px auto 6px; overflow: hidden; }
  .rest-bar { height: 100%; background: var(--success); border-radius: 1px; animation: drain 3s linear forwards; }
  @keyframes drain { from{width:100%} to{width:0%} }
  .rest-msg { text-align: center; color: var(--muted-fg); font-size: 13px; padding: 8px 0; }

  /* 输入 */
  #chat-input {
    font-family: var(--font-mono);
    outline: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 14px;
    font-size: 14px;
    width: 100%;
    transition: border-color .15s, box-shadow .15s;
    background: var(--bg);
    color: var(--fg);
    touch-action: manipulation;
  }
  #chat-input:focus-visible { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(17,24,39,.15); }
  #chat-input::placeholder { color: var(--muted-fg); }
  #chat-input:disabled { opacity: .5; cursor: not-allowed; }
  #send-btn {
    background: var(--primary); color: var(--primary-fg);
    border: none; border-radius: var(--radius);
    padding: 0 22px; font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: opacity .15s;
    font-family: var(--font-sans);
    touch-action: manipulation;
  }
  #send-btn:hover { opacity: .85; }
  #send-btn:focus-visible { box-shadow: 0 0 0 2px rgba(17,24,39,.15); }
  #send-btn:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>

<!-- 顶栏 -->
<header style="border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-weight:600;font-size:15px">LumiAgent</span>
    <span class="hint-tag">V1</span>
  </div>
  <div style="display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted-fg)">
    <div style="display:flex;align-items:center"><span class="dot ok" id="dot"></span><span id="st">就绪</span></div>
    <div class="hint-tag" id="model-tag">LongCat-2.0</div>
    <a href="https://github.com/k3234/lumiagent" target="_blank" rel="noopener" style="color:var(--muted-fg);text-decoration:none">GitHub</a>
  </div>
</header>

<!-- 终端 -->
<main id="terminal" style="flex:1;overflow-y:auto;padding:20px 24px;max-width:780px;margin:0 auto;width:100%">

  <div class="welcome-box">
    <h1>LumiAgent — 算力平权，让老设备也能用AI</h1>
    <p>为老旧设备而生的AI编程调度器 &nbsp;|&nbsp; Trae 创意大赛参赛作品</p>
  </div>

  <div class="sys-msg">
    <span class="hint-tag">agent_core.py</span>
    <span id="hint" style="font-family:var(--font-mono);font-size:11px">等待输入... 直接输入问题或 /help 查看帮助</span>
  </div>

</main>

<!-- 输入 -->
<footer style="border-top:1px solid var(--border);padding:14px 24px;flex-shrink:0;background:var(--bg)">
  <div style="max-width:780px;margin:0 auto">
    <div style="display:flex;gap:10px">
      <label for="chat-input" class="sr-only">输入编程问题</label>
      <input type="text" id="chat-input" name="chat-input" placeholder="输入编程问题 或 /help ..." autocomplete="off" aria-label="输入编程问题或命令">
      <button id="send-btn" aria-label="发送消息">发送</button>
    </div>
    <div style="margin-top:6px;font-size:10px;color:var(--muted-fg)">Enter 发送 &nbsp;|&nbsp; /help 帮助 &nbsp;|&nbsp; exit 退出</div>
  </div>
</footer>

<script>
// ===========================================
// LumiAgent V1 Web — 复刻 agent_core.py 全部功能
// 极简设计系统 / Geist Mono 终端风格
// ===========================================
const $ = id => document.getElementById(id);
const terminal = $('terminal');
const input = $('chat-input');
const sendBtn = $('send-btn');
const dot = $('dot');
const st = $('st');
const modelTag = $('model-tag');
const hint = $('hint');

let busy = false, alive = true;
const API = '/api/chat';  // Cloudflare Pages Functions — 同域，无需跨域

// 源代码提示语 — 映射 agent_core.py 每一步
const H = {
  input:    'user_input = input("\\n📝 请输入问题: ").strip()',
  help:     'if user_input.lower() == "/help":',
  exit:     'if user_input.lower() in ("exit","quit","退出"):',
  empty:    'if not user_input: continue',
  req:      'response = requests.post(self.url, json=payload, timeout=60)',
  resp:     'return data.get("response", "未获取到回答")',
  rest1:    'print("💤 为节省资源，Agent进入休眠状态...")',
  rest2:    'print("✓ 模型已卸载，内存已释放")',
  err:      'except Exception: return "错误：请求处理时发生未知问题"',
};
function setHint(k) { hint.textContent = H[k] || ''; }

function setStatus(s) {
  dot.className = 'dot';
  if (s==='ready')   { dot.classList.add('ok');   st.textContent='就绪'; }
  if (s==='think')   { dot.classList.add('think'); st.textContent='思考中'; }
  if (s==='rest')    { dot.classList.add('rest');  st.textContent='休眠中'; }
  if (s==='err')     { dot.classList.add('rest');  st.textContent='错误'; }
}

function scroll() { terminal.scrollTop = terminal.scrollHeight; }

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function addSys(t) { const d=document.createElement('div'); d.className='sys-msg'; d.innerHTML='<span class="hint-tag">agent_core.py</span><span style="font-family:var(--font-mono);font-size:11px">'+esc(t)+'</span>'; terminal.appendChild(d); scroll(); }

function addUser(t) { const d=document.createElement('div'); d.className='user-msg'; d.innerHTML='<div class="user-label">You</div>'+esc(t); terminal.appendChild(d); scroll(); }

function addAi(t) { const d=document.createElement('div'); d.className='ai-msg'; d.innerHTML='<div class="ai-label">AI</div>'+fmt(t); terminal.appendChild(d); scroll(); }

function addRest() {
  const d=document.createElement('div');
  d.className='rest-msg';
  d.innerHTML='💤 Agent 进入休眠状态...<div class="rest-bar-wrap"><div class="rest-bar"></div></div><div style="font-size:12px;margin-top:4px">✓ 模型已卸载，内存已释放</div>';
  terminal.appendChild(d); scroll();
}

function fmt(t) {
  t = t.replace(/```(\w*)\n([\s\S]*?)```/g, (_,l,c) => '<div class="code-block">'+hl(esc(c))+'</div>');
  t = t.replace(/`([^`]+)`/g, '<code style="font-family:var(--font-mono);background:var(--muted);padding:1px 6px;border-radius:3px;font-size:13px">$1</code>');
  t = t.replace(/\n/g, '<br>');
  return t;
}

function hl(c) {
  c = c.replace(/\b(def|class|import|from|return|if|else|elif|for|while|try|except|with|as|in|not|and|or|True|False|None|self|print|range|len|input|strip|break|continue)\b/g, '<span class="kw">$1</span>');
  c = c.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
  c = c.replace(/(#.*$)/gm, '<span class="cmt">$1</span>');
  c = c.replace(/(["'])(?:(?=(\\?))\2.)*?\1/g, '<span class="str">$&</span>');
  return c;
}

// --- API ---
const MAX_INPUT_LEN = 2000;

async function callApi(msg) {
  try {
    const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:msg}) });
    if (r.status === 429) return { role:'assistant', content:'⚠ 请求过于频繁，请稍后再试', model:'system' };
    if (r.status === 413) return { role:'assistant', content:'⚠ 消息过长，请缩短后重试', model:'system' };
    if (r.status === 400) return { role:'assistant', content:'⚠ 输入内容不合规', model:'system' };
    const data = await r.json();
    if (data.error) return { role:'assistant', content:'⚠ ' + data.error, model:'system' };
    return data;
  } catch(e) {
    return { role:'assistant', content:'错误：无法连接到API服务', model:'error' };
  }
}

// --- 主循环 — agent_core.py main() ---
async function send() {
  const raw = input.value.trim();
  if (!raw || busy) return;
  if (!alive) { addSys('会话已结束，刷新页面可重新开始'); return; }

  busy = true;
  input.value = '';

  // 前端输入长度校验
  if (raw.length > MAX_INPUT_LEN) {
    addSys('⚠ 消息过长，最多 ' + MAX_INPUT_LEN + ' 字符');
    busy = false;
    return;
  }

  // exit 检查
  if (['exit','quit','退出'].includes(raw.toLowerCase())) {
    setHint('exit');
    addSys('👋 再见！设备休息一下~');
    setStatus('ready');
    alive = false;
    input.disabled = true;
    sendBtn.disabled = true;
    input.placeholder = '会话已结束';
    busy = false;
    return;
  }

  // /help
  if (raw.toLowerCase() === '/help') {
    setHint('help');
    setStatus('think');
    const r = await callApi('/help');
    addAi(r.content);
    setStatus('ready');
    setHint('input');
    busy = false;
    return;
  }

  // 空
  if (!raw) { setHint('empty'); busy = false; return; }

  addUser(raw);

  // process
  setHint('req');
  setStatus('think');
  addSys('→ 调用 ' + modelTag.textContent + ' ...');

  const r = await callApi(raw);

  setHint('resp');
  addAi(r.content);
  if (r.model) modelTag.textContent = r.model;

  // rest
  setHint('rest1');
  setStatus('rest');
  addRest();

  setTimeout(() => {
    setHint('rest2');
    setStatus('ready');
    setHint('input');
    busy = false;
  }, 3200);
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

setStatus('ready');
input.focus();
</script>
</body>
</html>
